# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# 2026-07-22: bumped 2048m -> 3584m — assembleCanaryDebug OOM'd (heap space)
# in :app:mergeExtDexCanaryDebug. Debug dexing has more classes than release
# (no R8 shrinking) and the 3.0 native-stack additions (vision-camera 5,
# freerasp 5, expo-video/audio) pushed it over 2048m. Kept below 4096m —
# this Mac only has 8GB total RAM.
org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=768m

# 2026-08-23: this Mac has 8GB total RAM (see the -Xmx3584m note above) and
# local `eas build --local` runs spin up the Gradle daemon (Xmx3584m) PLUS
# a separate Kotlin compile daemon per distinct Kotlin version in play
# (2.0.21 for react-native-google-mobile-ads's own toolchain pin, 2.1.20
# for everything else — each ALSO Xmx3584m), so unconstrained parallelism
# can ask for 10GB+ of JVM heap at once. Confirmed via `sysctl vm.swapusage`
# (3.7 of 5GB swap in use, no free headroom) right before several local
# builds got silently killed mid-compile with no Gradle error in the log —
# consistent with memory pressure, not a real build failure. Capping worker
# parallelism (not the per-daemon heap ceiling, which was already tuned up
# once for a real debug-dexing OOM) reduces how much of that runs at once.
org.gradle.workers.max=2

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Enable AAPT2 PNG crunching
android.enablePngCrunchInReleaseBuilds=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=arm64-v8a

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Enable GIF support in React Native images (~200 B increase)
expo.gif.enabled=true
# Enable webp support in React Native images (~85 KB increase)
expo.webp.enabled=true
# Enable animated webp support (~3.4 MB increase)
# Disabled by default because iOS doesn't support animated webp
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging to compress native libraries in the resulting APK.
expo.useLegacyPackaging=false

# Whether the app is configured to use edge-to-edge via the app config or `react-native-edge-to-edge` plugin
# SDK 54 removes the opt-out (mandatory edge-to-edge) — flipped 2026-07-09 as
# the last step of the sdk54-upgrade edge-to-edge migration (see
# SDK54_UPGRADE_PLAN.md Phase 4). Every file in that phase's risk list has
# been given explicit useSafeAreaInsets() handling before this flag flips.
expo.edgeToEdgeEnabled=true
android.minSdkVersion=26
android.compileSdkVersion=36
android.targetSdkVersion=36
android.buildToolsVersion=36.0.0
android.kotlinVersion=2.1.20
sentry.autoUploadSourceMaps=false

# Raise AsyncStorage SQLite ceiling from 6MB default to 20MB. Default cap
# triggers SQLITE_FULL (code 13) on Banana Shop purchases when the profile
# cache (avatar base64 URIs ~50KB each) + message cache exceed 6MB. OTA
# band-aid (safeStorageSet self-heal + MAX_PROFILE_CACHE 200->80) shipped
# 2026-05-05; this is the durable native fix.
AsyncStorage_db_size_in_MB=20
