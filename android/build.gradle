// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.2')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Pin NDK version explicitly. expo-modules-autolinking's ExpoRootProjectPlugin
// only sets rootProject.ext.ndkVersion via setIfNotExist(), silently falling
// back to its own hardcoded internal default (currently 27.1.12297006,
// coincidentally matching) if nothing set it first — app.config.ts's
// expo-build-properties `ndkVersion` field is a no-op for Android (no Android
// writer support for that key), so without this line the NDK version isn't
// actually pinned anywhere in this repo. Nitro Modules
// (react-native-nitro-modules, added for vision-camera 5) documents NDK 27+
// as a floor — this must not silently drift on an autolinking bump.
rootProject.ext.ndkVersion = "27.1.12297006"

// 3.1 (AGP 9 + JDK 21): libraries that set no Java version (e.g. react-native-image-colors on
// AGP 8+) compile Java for 17 but Kotlin for the JDK's 21, and Kotlin's target check fails the
// build. Match each library's Kotlin target to its own Java target — per project, never one
// forced version, so libraries pinned to 11 stay on 11.
subprojects { p ->
  def matchKotlinToJava = {
    def android = p.extensions.findByName("android")
    if (android == null || !p.plugins.hasPlugin("org.jetbrains.kotlin.android")) return
    // Lazy: targetCompatibility isn't final until the Android plugin finishes configuring.
    p.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
      compilerOptions.jvmTarget.set(p.provider {
        org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(android.compileOptions.targetCompatibility.toString())
      })
    }
  }
  if (p.state.executed) matchKotlinToJava() else p.afterEvaluate { matchKotlinToJava() }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
