apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// google-services.json only has a client registered for com.onlymonkes.app —
// the canary flavor (com.onlymonkes.app.canary) has no matching Firebase app,
// which makes the plugin's processGoogleServices task fail for that variant.
// Canary exists to test native modules (Reanimated/vision-camera/Skia), not
// push notifications, so we just skip applying the plugin when a canary
// variant is being built rather than registering a second Firebase app.
def isCanaryBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains("canary") }
if (!isCanaryBuild) {
    apply plugin: "com.google.gms.google-services"
}

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// Sentry source map upload — re-enable when needed for debugging
// apply from: new File(["node", "--print", "require('path').dirname(require.resolve('@sentry/react-native/package.json'))"].execute().text.trim(), "sentry.gradle")

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.onlymonkes.app'
    defaultConfig {
        applicationId 'com.onlymonkes.app'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 48
        versionName "3.0.4"
        // English-only — strips non-English resources from native libs (livekit,
        // xmtp, skia, vision-camera). ~2-5 MB savings depending on dep verbosity.
        resConfigs "en"
    }
    // 2026-07-09: "canary" flavor — a genuinely separate Android app (distinct
    // applicationId) for testing risky native changes (Reanimated 4, vision-
    // camera 5, Skia bump) on a real device without touching the production
    // install. Different package = different app to Android: separate storage,
    // separate XMTP identity, can be installed/uninstalled/wiped freely with
    // zero effect on the real app's wallet/achievements/data.
    //
    // 2026-08-01: `production` (same applicationId as today's live app) is
    // being promoted to carry the OnlyMonkes 3.0 native stack that canary has
    // been proving out (Reanimated 4, vision-camera 5, freerasp 5, etc.) —
    // defaultConfig's versionCode/versionName above were bumped 38/"2.38" to
    // 39/"3.0.0" for this release. A real native rebuild+distribute (not an
    // OTA) is required either way, so existing users get the matching native
    // binary + JS together — no repeat of the Reanimated v3/v4 OTA mismatch
    // incident. `canary` stays for the NEXT round of risky native testing.
    flavorDimensions "env"
    productFlavors {
        production {
            dimension "env"
        }
        canary {
            dimension "env"
            applicationId "com.onlymonkes.app.canary"
            // 2026-08-05: production is now on 3.0.0 (this flavor's native-stack
            // work — expo-av removal, vision-camera 5, freerasp 5 — landed
            // there). Bumped past it so canary always reads as "ahead of
            // production," ready for whatever's tested here next.
            versionName "3.1.0-test"
        }
    }
    // ABI splits → arm64-v8a only. Every Solana Mobile wallet device (Seeker,
    // Saga, Phantom-on-Android, Solflare-on-Android) is arm64. The other ABIs
    // (x86, x86_64, armeabi-v7a) are dead weight — drops APK from ~88MB to
    // ~55MB. Combined with `reactNativeArchitectures=arm64-v8a` in
    // gradle.properties (which restricts RN's own native compile).
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('onlymonkes-release.keystore')
            storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD')
            keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: System.getenv('RELEASE_KEY_ALIAS')
            keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEY_PASSWORD')
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            // R8/ProGuard disabled — R8 strips JNI loaders needed by RN 0.79 new arch
            shrinkResources false
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

configurations.all {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${expoLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${expoLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${expoLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Data Oracle Phase 1 — periodic signed-batch upload (SentimentWorkScheduler.kt /
    // SentimentSyncWorker.kt). WorkManager, not a foreground service — see the plan doc:
    // Android 15+ caps dataSync foreground services at 6h/24h and blocks background
    // self-launch, WorkManager's 15-min floor is fine for a ~30-min upload cadence.
    implementation("androidx.work:work-runtime-ktx:2.9.1")
}

// 2026-07-10: NECESSARY BUT NOT SUFFICIENT fix for a still-unresolved native
// build bug on this branch. RN 0.81's gradle plugin wires
// generateAutolinkingNewArchitectureFiles (writes
// build/generated/autolinking/src/main/jni/autolinking.h, which OnLoad.cpp
// #includes) as a dependency of the generic `preBuild` task only. With the
// `canary`/`production` productFlavors split added this session, AGP's CMake
// configure/build tasks for the app module don't route through `preBuild` at
// all, so without this block the header generation task never even runs
// before the C++ compile. This line below IS confirmed necessary (verified
// via debug instrumentation: generateAutolinkingNewArchitectureFiles now
// reliably runs/is-UP-TO-DATE before :app:configureCMakeRelWithDebInfo in
// every build) - use tasks.named() (lazy), not tasks.findByName() (eager;
// forces the task to realize before react-native-gradle-plugin finishes
// configuring it, causing it to silently write nothing).
//
// BUT: even with this fix, `generated/autolinking/src/main/jni/` is
// mysteriously EMPTY again by the time :app:buildCMakeRelWithDebInfo runs,
// every single time, on a full `assembleCanaryRelease` - even when the
// generate task shows UP-TO-DATE. Confirmed via isolated single-task Gradle
// invocations that neither generateAutolinkingNewArchitectureFiles nor
// configureCMakeRelWithDebInfo deletes the directory on their own; something
// specific to the FULL build graph does. Root cause NOT found as of this
// commit - see project memory for the full investigation and next-step
// options. Do not remove this block; it's confirmed necessary, just not
// sufficient on its own.
afterEvaluate {
    if (tasks.names.contains("generateAutolinkingNewArchitectureFiles")) {
        def autolinkingTask = tasks.named("generateAutolinkingNewArchitectureFiles")
        tasks.matching { it.name.startsWith("configureCMake") || it.name.startsWith("buildCMake") }.configureEach {
            dependsOn(autolinkingTask)
        }
    }
    // 2026-08-02: same missing-dependsOn gap as above, on the Kotlin/Java side.
    // generateAutolinkingPackageList writes the PackageList class that
    // MainApplication.kt references; without this wiring compileCanaryReleaseKotlin
    // can run before it exists on the canary flavor's task graph, failing with
    // "Unresolved reference 'PackageList'".
    if (tasks.names.contains("generateAutolinkingPackageList")) {
        def packageListTask = tasks.named("generateAutolinkingPackageList")
        tasks.matching { it.name.startsWith("compile") && it.name.endsWith("Kotlin") }.configureEach {
            dependsOn(packageListTask)
        }
    }
}

// 2026-08-02: same directory-wipe symptom family as the autolinking.h issue
// above, this time hitting createBundle*JsAndAssets — Gradle clears a task's
// declared @OutputDirectory before running it, and the underlying `node
// .../cli.js bundle --sourcemap-output <path>` command doesn't mkdir -p its
// own parent directory first, so on a variant's first-ever local build (no
// prior directory to leave behind) it fails with ENOENT writing the .map
// file. A pre-invocation `mkdir` doesn't help — Gradle wipes it again before
// the task body runs. This doFirst hook runs AFTER Gradle's own cleanup but
// BEFORE the task action, so it always exists when needed.
tasks.matching { it.name.startsWith("createBundle") && it.name.endsWith("JsAndAssets") }.configureEach {
    doFirst {
        def variant = name.replace("createBundle", "").replace("JsAndAssets", "")
        def variantLower = variant[0].toLowerCase() + variant.substring(1)
        file("${buildDir}/intermediates/sourcemaps/react/${variantLower}").mkdirs()
    }
}
