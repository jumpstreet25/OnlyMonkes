<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<style>
  *{margin:0;padding:0}
  body{background:#0A0A0F;overflow:hidden;touch-action:none}
  canvas{display:block}
  #tooltip{
    position:absolute;display:none;
    background:rgba(10,10,15,0.9);color:#F8F8FF;
    padding:8px 12px;border-radius:10px;font:12px sans-serif;
    border:1px solid rgba(108,180,238,0.3);
    pointer-events:none;z-index:10;max-width:200px;
    box-shadow:0 0 12px rgba(108,180,238,0.2);
  }
</style>
</head><body>
<div id="tooltip"></div>
<div id="loading" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#6CB4EE;font:14px sans-serif;text-align:center">Loading globe...</div>
<script>window.onerror=function(m){document.getElementById('loading').innerHTML='Globe error: '+m;return false;}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>
<script>
var MARKERS = [];
let scene, camera, renderer, globe, controls, raycaster, mouse;
let markerMeshes = [];
var eventMeshes = []; // event sprites + beams — culled when on far side of globe
var pfpCache = {};

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 2.5);

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x0A0A0F, 1);
  document.body.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enablePan = false;
  controls.minDistance = 1.3;
  controls.maxDistance = 4.5;
  controls.enableDamping = true;
  controls.dampingFactor = 0.04;
  controls.rotateSpeed = 0.5;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.4;

  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  var dir = new THREE.DirectionalLight(0xffffff, 0.9);
  dir.position.set(5, 3, 5);
  scene.add(dir);
  var blue = new THREE.PointLight(0x6CB4EE, 0.4, 10);
  blue.position.set(-3, 2, 3);
  scene.add(blue);

  // Globe
  var geo = new THREE.SphereGeometry(1, 64, 64);
  var tex = new THREE.TextureLoader().load(
    'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'
  );
  var mat = new THREE.MeshStandardMaterial({ map:tex, metalness:0.1, roughness:0.7 });
  globe = new THREE.Mesh(geo, mat);
  scene.add(globe);

  // Atmosphere
  var atmosGeo = new THREE.SphereGeometry(1.04, 48, 48);
  var atmosMat = new THREE.MeshBasicMaterial({
    color:0x6CB4EE, transparent:true, opacity:0.06, side:THREE.BackSide
  });
  scene.add(new THREE.Mesh(atmosGeo, atmosMat));

  // Raycaster for tap detection
  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // Load a PFP image into a circular canvas texture (cached in global pfpCache)
  function loadPfpTexture(id, imgSrc, callback) {
    if (pfpCache[id]) { callback(pfpCache[id]); return; }
    var img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() {
      var canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      var ctx = canvas.getContext('2d');
      // Clear canvas to fully transparent
      ctx.clearRect(0, 0, 64, 64);
      // Circular clip -- only the circle area gets drawn
      ctx.beginPath();
      ctx.arc(32, 32, 30, 0, Math.PI * 2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(img, 0, 0, 64, 64);
      var tex = new THREE.CanvasTexture(canvas);
      tex.minFilter = THREE.LinearFilter;
      tex.needsUpdate = true;
      pfpCache[id] = tex;
      callback(tex);
    };
    img.onerror = function() { /* skip -- no PFP shown */ };
    img.src = imgSrc;
  }

  // ── Cluster system: single PFP + count badge for 2+ co-located users ──
  var existingIds = {};
  var locationGroups = {}; // 'lat,lng' -> array of markers
  var clusterMeshes = {}; // locKey -> cluster mesh (for 4+ groups)

  function addUserMarker(m, pos) {
    var mesh;
    if (m.nftImage) {
      var spriteMat = new THREE.SpriteMaterial({ transparent: true });
      mesh = new THREE.Sprite(spriteMat);
      mesh.position.copy(pos);
      mesh.scale.set(0.09, 0.09, 1);
      mesh.userData = m;
      globe.add(mesh);
      markerMeshes.push(mesh);
      loadPfpTexture(m.id, m.nftImage, function(tex) {
        spriteMat.map = tex;
        spriteMat.needsUpdate = true;
      });
    } else {
      var uGeo = new THREE.SphereGeometry(0.018, 12, 12);
      var uMat = new THREE.MeshBasicMaterial({ color:0x9945FF });
      mesh = new THREE.Mesh(uGeo, uMat);
      mesh.position.copy(pos);
      mesh.userData = m;
      globe.add(mesh);
      markerMeshes.push(mesh);
    }
    return mesh;
  }

  // Create a cluster bubble (purple sphere with white count text sprite)
  function createClusterBubble(locKey, centerPos, count) {
    // Remove old cluster if exists
    if (clusterMeshes[locKey]) {
      globe.remove(clusterMeshes[locKey]);
      var idx = markerMeshes.indexOf(clusterMeshes[locKey]);
      if (idx >= 0) markerMeshes.splice(idx, 1);
    }

    // Purple sphere
    var cGeo = new THREE.SphereGeometry(0.04, 16, 16);
    var cMat = new THREE.MeshBasicMaterial({ color:0x9945FF, transparent:true, opacity:0.8 });
    var cluster = new THREE.Mesh(cGeo, cMat);
    cluster.position.copy(centerPos);
    // Store all markers in this cluster for tap handling
    cluster.userData = { type: 'cluster', locKey: locKey, count: count, markers: locationGroups[locKey] };
    globe.add(cluster);
    markerMeshes.push(cluster);
    clusterMeshes[locKey] = cluster;

    // Count badge as canvas sprite
    var canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0,0,32,32);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(count), 16, 16);
    var tex = new THREE.CanvasTexture(canvas);
    var badgeMat = new THREE.SpriteMaterial({ map:tex, transparent:true });
    var badge = new THREE.Sprite(badgeMat);
    badge.position.copy(centerPos);
    var dir = centerPos.clone().normalize();
    badge.position.add(dir.multiplyScalar(0.03));
    badge.scale.set(0.05, 0.05, 1);
    globe.add(badge);
  }

  var locationMeshes = {}; // locKey -> array of meshes to remove on rebuild

  // Rebuild a location group's visuals -- removes old meshes first
  function rebuildLocationGroup(locKey) {
    var group = locationGroups[locKey];
    if (!group || group.length === 0) return;

    // Remove ALL existing meshes for this location
    if (locationMeshes[locKey]) {
      locationMeshes[locKey].forEach(function(mesh) {
        globe.remove(mesh);
        var idx = markerMeshes.indexOf(mesh);
        if (idx >= 0) markerMeshes.splice(idx, 1);
      });
    }
    locationMeshes[locKey] = [];
    // Also remove cluster if exists
    if (clusterMeshes[locKey]) {
      globe.remove(clusterMeshes[locKey]);
      var cidx = markerMeshes.indexOf(clusterMeshes[locKey]);
      if (cidx >= 0) markerMeshes.splice(cidx, 1);
      delete clusterMeshes[locKey];
    }

    var baseLat = group[0].lat;
    var baseLng = group[0].lng;
    var centerPos = latLngToXYZ(baseLat, baseLng, 1.01);

    if (group.length === 1) {
      // Single user -- just show PFP at center
      var m1 = addUserMarker(group[0], centerPos);
      if (m1) locationMeshes[locKey].push(m1);
    } else {
      // 2+ users -- stacked PFPs like Google Maps, tap opens carousel
      var dir = centerPos.clone().normalize();
      var right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
      var up = new THREE.Vector3().crossVectors(right, dir).normalize();

      // Show up to 3 stacked PFPs, offset like fanned cards
      var stackCount = Math.min(group.length, 3);
      var stackOffset = 0.032; // spacing between stacked PFPs

      // Render back-to-front so the first user is on top
      for (var i = stackCount - 1; i >= 0; i--) {
        var offsetPos = centerPos.clone();
        // Fan rightward and slightly down for each card behind
        offsetPos.add(right.clone().multiplyScalar(i * stackOffset));
        offsetPos.add(up.clone().multiplyScalar(-i * stackOffset * 0.5));
        // Lift slightly above globe so stacked cards don't z-fight
        offsetPos.add(dir.clone().multiplyScalar(i * 0.003));

        var stackMarker = addUserMarker(group[i], offsetPos);
        if (stackMarker) {
          // All stacked PFPs open the carousel on tap
          stackMarker.userData = { type: 'cluster', locKey: locKey, count: group.length, markers: group, label: group[i].label };
          locationMeshes[locKey].push(stackMarker);
        }
      }

      // Count badge in upper-right corner of the stack
      var canvas = document.createElement('canvas');
      canvas.width = 48; canvas.height = 48;
      var ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.arc(24, 24, 14, 0, Math.PI * 2);
      ctx.fillStyle = '#9945FF';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(group.length), 24, 24);
      var tex = new THREE.CanvasTexture(canvas);
      var badgeMat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
      var badge = new THREE.Sprite(badgeMat);
      badge.position.copy(centerPos);
      badge.position.add(dir.clone().multiplyScalar(0.02));
      badge.position.add(right.clone().multiplyScalar(0.045));
      badge.position.add(up.clone().multiplyScalar(0.045));
      badge.scale.set(0.04, 0.04, 1);
      badge.userData = { type: 'cluster', locKey: locKey, count: group.length, markers: group };
      globe.add(badge);
      markerMeshes.push(badge);
      locationMeshes[locKey].push(badge);
    }
  }

  window.addMarkers = function(newMarkers) {
    // Separate users from events
    var userMarkers = [];
    var eventMarkers = [];
    newMarkers.forEach(function(m) {
      if (existingIds[m.id]) {
        // Already known — but re-check if it needs to be re-grouped
        // (e.g., user was added before co-located user arrived)
        if (m.type === 'user') userMarkers.push(m);
        return;
      }
      existingIds[m.id] = true;
      MARKERS.push(m);
      if (m.type === 'user') userMarkers.push(m);
      else eventMarkers.push(m);
    });

    // Re-group ALL user markers at affected locations (not just new ones)
    // This ensures co-located users cluster correctly even when arriving in separate batches
    var changedLocKeys = {};
    userMarkers.forEach(function(m) {
      var locKey = Math.round(m.lat*10) + ',' + Math.round(m.lng*10);
      changedLocKeys[locKey] = true;
    });

    // Rebuild location groups from scratch for changed keys using ALL known markers
    for (var locKey in changedLocKeys) {
      locationGroups[locKey] = [];
    }
    MARKERS.forEach(function(m) {
      if (m.type !== 'user') return;
      var locKey = Math.round(m.lat*10) + ',' + Math.round(m.lng*10);
      if (changedLocKeys[locKey]) {
        locationGroups[locKey].push(m);
      }
    });

    // Rebuild visual for each changed location group
    for (var locKey in changedLocKeys) {
      rebuildLocationGroup(locKey);
    }

    // Solana logo texture (cached, drawn once via canvas)
    var _solLogoTex = null;
    function getSolanaLogoTexture() {
      if (_solLogoTex) return _solLogoTex;
      var size = 128;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');

      // Solana logo: 3 horizontal bars with slight slant, gradient #9945FF → #14F195
      var grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#9945FF');
      grad.addColorStop(1, '#14F195');
      ctx.fillStyle = grad;

      // Bar dimensions (proportional to Solana logo)
      var barH = size * 0.18;
      var skew = size * 0.12;
      var pad = size * 0.15;
      var w = size - pad * 2;

      // Top bar (arrow pointing right)
      ctx.beginPath();
      ctx.moveTo(pad, pad);
      ctx.lineTo(pad + w, pad);
      ctx.lineTo(pad + w - skew, pad + barH);
      ctx.lineTo(pad - skew, pad + barH);
      ctx.closePath(); ctx.fill();

      // Middle bar (arrow pointing left)
      ctx.beginPath();
      var midY = (size - barH) / 2;
      ctx.moveTo(pad - skew, midY);
      ctx.lineTo(pad + w - skew, midY);
      ctx.lineTo(pad + w, midY + barH);
      ctx.lineTo(pad, midY + barH);
      ctx.closePath(); ctx.fill();

      // Bottom bar (arrow pointing right)
      ctx.beginPath();
      var botY = size - pad - barH;
      ctx.moveTo(pad, botY);
      ctx.lineTo(pad + w, botY);
      ctx.lineTo(pad + w - skew, botY + barH);
      ctx.lineTo(pad - skew, botY + barH);
      ctx.closePath(); ctx.fill();

      var tex = new THREE.CanvasTexture(canvas);
      tex.needsUpdate = true;
      _solLogoTex = tex;
      return tex;
    }

    // Events -- Solana logo sprites + gradient pin beams
    eventMarkers.forEach(function(m) {
      var pos = latLngToXYZ(m.lat, m.lng, 1.01);

      // Solana logo sprite (faces camera, 70% opacity)
      var logoMat = new THREE.SpriteMaterial({
        map: getSolanaLogoTexture(),
        transparent: true,
        opacity: 0.7,
        depthTest: false
      });
      var logo = new THREE.Sprite(logoMat);
      var logoDir = pos.clone().normalize();
      logo.position.copy(pos.clone().add(logoDir.multiplyScalar(0.15)));
      logo.scale.set(0.06, 0.06, 1);
      logo.userData = m;
      globe.add(logo);
      markerMeshes.push(logo);
      eventMeshes.push(logo);

      // Pin beam — Solana gradient purple (#9945FF)
      var bGeo = new THREE.CylinderGeometry(0.003, 0.003, 0.15, 6);
      var bMat = new THREE.MeshBasicMaterial({ color: 0x9945FF, transparent: true, opacity: 0.5 });
      var beam = new THREE.Mesh(bGeo, bMat);
      var d = pos.clone().normalize();
      beam.position.copy(pos.clone().add(d.multiplyScalar(0.075)));
      beam.lookAt(0, 0, 0);
      beam.rotateX(Math.PI / 2);
      globe.add(beam);
      eventMeshes.push(beam);
    });
  };

  // Listen for marker data from React Native
  document.addEventListener('message', function(e) {
    try {
      var data = JSON.parse(e.data);
      if (data.action === 'addMarkers' && data.markers) {
        window.addMarkers(data.markers);
      }
    } catch(err) {}
  });
  // Android WebView uses window.document for message events
  window.addEventListener('message', function(e) {
    try {
      var data = JSON.parse(e.data);
      if (data.action === 'addMarkers' && data.markers) {
        window.addMarkers(data.markers);
      }
    } catch(err) {}
  });

  // Tap handler
  renderer.domElement.addEventListener('pointerup', onTap, false);
  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function latLngToXYZ(lat, lng, r) {
  var phi = (90 - lat) * Math.PI / 180;
  var theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -(r * Math.sin(phi) * Math.cos(theta)),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
}

function onTap(e) {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  var hits = raycaster.intersectObjects(markerMeshes);
  if (hits.length > 0) {
    var data = hits[0].object.userData;
    if (window.ReactNativeWebView) {
      if (data.type === 'cluster') {
        // Cluster tap -- send all markers in this group to RN for bottom sheet
        window.ReactNativeWebView.postMessage(JSON.stringify({
          action: 'clusterTap',
          markers: data.markers,
          count: data.count
        }));
      } else {
        // Single marker tap
        window.ReactNativeWebView.postMessage(JSON.stringify({
          action: 'markerTap',
          marker: data
        }));
      }
    }
  }
}

var tooltip = document.getElementById('tooltip');
function showTooltip(x, y, text) {
  tooltip.style.display = 'block';
  tooltip.style.left = x + 'px';
  tooltip.style.top = (y - 40) + 'px';
  tooltip.textContent = text;
}

var _cullVec = new THREE.Vector3();
var _camDir = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  // Cull event markers on the far side of the globe
  _camDir.copy(camera.position).normalize();
  for (var ci = 0; ci < eventMeshes.length; ci++) {
    var em = eventMeshes[ci];
    // Get world position (markers are children of globe which may be rotated)
    em.getWorldPosition(_cullVec);
    _cullVec.normalize();
    em.visible = _cullVec.dot(_camDir) > 0.05;
  }

  renderer.render(scene, camera);

  // Hover tooltip (only on desktop, skip on mobile)
  if (mouse && !('ontouchstart' in window)) {
    raycaster.setFromCamera(mouse, camera);
    var hits = raycaster.intersectObjects(markerMeshes);
    if (hits.length > 0) {
      var d = hits[0].object.userData;
      var emoji = d.type==='user'?'🐒':d.type==='luma-event'?'📍':'🟢';
      showTooltip(
        (hits[0].point.x + 1) * window.innerWidth / 2,
        (-hits[0].point.y + 1) * window.innerHeight / 2,
        emoji + ' ' + d.label
      );
    } else {
      tooltip.style.display = 'none';
    }
  }
}
try{init();animate();document.getElementById('loading').style.display='none';}catch(e){document.getElementById('loading').innerHTML='Init failed: '+e.message;}
</script>
</body></html>
