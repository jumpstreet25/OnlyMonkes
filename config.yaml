  catalog:
    en-US:
      name: OnlyMonkes
      short_description: Saga Monkes chat, games & AI
      long_description: |-
        OnlyMonkes is the home of Saga Monkes holders on Solana Mobile. Connect your wallet, prove you hold a Saga Monke, and you're in. No sign-up, no email, no password.

        🐒 MAIN CHAT: one encrypted group with every verified holder. GIFs, photos, video, replies, reactions, stickers, threads, polls, and tappable $TOKEN mentions that open a live chart.
        💬 DIRECT MESSAGES: private 1-on-1 chats with any holder, with push notifications.
        🧬 GENESIS CHAT: a channel for Saga Genesis and Seeker Genesis Token holders.
        🎭 AVATAR ROOMS: hang out by voice as your own 3D monke. The camera tracks your face, so your monke talks, nods and smiles with you. Call Monke the bot in for a voice chat.
        🕹 MONKECAVES: a first-person cave shooter starring your own monke and its weapon. Five caves to escape, weekly fastest times, and Jungle Royale online matches against other holders.
        🏎 MONKEKART: a new race track every day. Drift, boost and race your ghost for the top spot on the daily board.
        🤖 AI AGENT #9385: "Monke", the community's trading bot. MonkeTrades posts setups with targets and stops, /ta and /chart give instant reads on any Solana token, and "Hey Monke" turns plain English into exit plans you approve.
        🌍 MONKE GLOBE: a 3D globe of holders and Solana events around the world.
        🍌 BANANAS: earn bananas for showing up, spend them in the Banana Shop on chat bubbles, name styles and worlds, collect badges and climb the leaderboards.
        🛒 MARKETPLACE: list, bid on and buy Saga Monkes inside the chat, paid in SKR.
        🎨 MONKE 3D & MONKEMEME: view any monke in 3D and turn yours into a cartoon meme.
        💸 TIPS: send SKR to any holder. Your own wallet signs every payment, and OnlyMonkes never holds your keys.

        Messages are end-to-end encrypted with XMTP (MLS). The app has no ads and no analytics SDK.

        REQUIRES: a Saga Monkes NFT (Genesis Chat needs a Saga Genesis or Seeker Genesis Token) and a Mobile Wallet Adapter wallet such as Seed Vault, Phantom, Solflare or Backpack.
      new_in_version: |-
        OnlyMonkes 3.1 is a big upgrade:
        • Chat moves to OnlyMonkes' own holders-only XMTP network. Your old chat history comes with you, read-only, under "Before the move".
        • Faster, more stable app: new React Native and Expo, fixed a startup crash on low memory, and native video playback is back.
        • MonkeCaves, Jungle Royale, MonkeKart, Monke 3D and the Monke Globe all live in the Banana Menu.
        • Your devices: use one account on up to 5 phones and remove any of them.
        • Account Recovery brings back your username, bio, location, bananas, badges, streak and shop items on a new phone.
        • Fingerprint lock, home-screen widget and shortcuts.
        • No ads and no analytics SDK.
      saga_features: Built for Seeker and Saga. Sign in with your wallet through Mobile Wallet Adapter (Seed Vault supported), device integrity checks use the phone's hardware key, and Avatar Rooms use the front camera for face tracking.
