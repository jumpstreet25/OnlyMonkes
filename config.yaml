solana_mobile_dapp_publisher_portal:
  testing_instructions: '1. Install the APK on a Seeker or Saga device with a compatible Solana wallet (Phantom or Solflare). 2. Open OnlyMonkes and tap "Connect Wallet". 3. Approve the connection in your wallet app. 4. The app will verify your Saga Monkes NFT ownership via Helius DAS API. 5. If you own a Saga Monkes NFT, select it from the picker to enter the community. 6. You will arrive at the main group chat. Send a message to confirm messaging works. 7. Tap the menu icon (top right) to access DMs, Community members, Events, and Settings. 8. Type /ta $SOL in chat to test the AI trading agent TA command. NOTE: NFT ownership is required to access the app. If you do not own a Saga Monkes NFT, the app will show a gate screen. Please contact us to arrange a test account.'
