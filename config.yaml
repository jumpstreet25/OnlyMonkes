  catalog:
    en-US:
      name: OnlyMonkes
      short_description: NFT-gated Monkes social app
      long_description: |-
        OnlyMonkes is the exclusive social hub for verified Saga Monkes NFT holders on Solana Mobile.
        Connect your Seeker wallet to prove ownership of your Saga Monkes NFT and unlock:
        🐒 GROUP CHAT — Real-time encrypted group messaging powered by XMTP v5 MLS protocol. Send text, GIFs, images, videos, stickers and reactions. Reply to messages, mention users with @username, and track $TOKEN prices inline.
        💬 DIRECT MESSAGES — Private 1-on-1 encrypted DMs with any verified holder. Full message history and push notifications.
        🎙 LIVE AUDIO ROOMS — Twitter Spaces-style live audio rooms built on LiveKit WebRTC. Hosts can start a room, listeners join, raise hand, and unmute.
        💸 TIPPING — Send $SKR tokens directly to any holder with the /tip command. Powered by Jupiter aggregator and Solana Mobile Wallet Adapter — no app switching required.
        🤖 AI TRADING AGENT — AI Agent #9385 monitors the top Solana tokens 24/7 with multi-timeframe technical analysis (RSI, MACD, EMA, Bollinger Bands, Ichimoku). Type /ta $SOL for instant TA signals.
        📅 COMMUNITY EVENTS — Browse and create OnlyMonkes community events via the built-in calendar.
        🔔 PUSH NOTIFICATIONS — Real-time alerts for new messages, mentions, reactions, live rooms, NFT sales, and TA trading signals.
        🛡 DECENTRALIZED & ENCRYPTED — All messages are end-to-end encrypted via XMTP. No central server. Your messages are yours.
        REQUIREMENTS: Saga Monkes NFT + compatible Solana wallet (Phantom, Solflare) on Seeker or Saga device.
      new_in_version: 'v2.20: Edit sent messages (1 min window), copy any message, share photos to X/Twitter with watermark, dark-themed popup modals, daily GMonke bot message, weekly PNL trade report, persistent login sessions, 7-day message cache, sports filter in Monke Bets, dedicated Privacy Policy and Terms pages.'
      saga_features: Optimized for Seeker — arm64-v8a only build with minSdk 24. Live audio rooms use LiveKit WebRTC with full Bluetooth headset support. Mobile Wallet Adapter biometric prompt (no app switching for tips/swaps).
