# OnlyMonkes web app (Expo web export) on Cloudflare Workers static assets.
# Deploy with scripts/web/deploy-site.sh — it builds dist-web/ first.
name = "onlymonkes-web"
main = "site-router.ts"
compatibility_date = "2026-10-01"
# Custom domains switch workers.dev off by default; testers use that link.
workers_dev = true

# Owner 2026-10-22: the web app is onlymonkes.app. site-router.ts hands the
# public-site paths (landing /welcome, /get, /download/apk, /open/*, legal,
# Blinks, webhooks) to onlymonkes-actions; everything else is the app.
# app.onlymonkes.app stays as an alias.
routes = [
  { pattern = "onlymonkes.app", custom_domain = true },
  { pattern = "www.onlymonkes.app", custom_domain = true },
  { pattern = "app.onlymonkes.app", custom_domain = true },
]

services = [
  { binding = "ACTIONS", service = "onlymonkes-actions" },
  # /svc/ledger/* and /svc/livekit-token (site-router.ts serviceRoute)
  { binding = "LEDGER", service = "monkeledger" },
  { binding = "LIVEKIT_TOKEN", service = "onlymonkes-livekit-token" },
]

[assets]
directory = "../../dist-web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Keep logs so CSP reports ([csp] …) can be read before the policy is enforced.
[observability]
enabled = true
