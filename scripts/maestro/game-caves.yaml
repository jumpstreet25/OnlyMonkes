# MonkeCaves in play: tap FIRE on the title card to start the cave, then fire twice
# right away so the shot shows the game (standing still too long gets the monke
# killed). NEVER add clearState here.
appId: ${APP_ID}
---
- waitForAnimationToEnd:
    timeout: 15000
- tapOn:
    point: "88%,90%"
- tapOn:
    point: "88%,90%"
- tapOn:
    point: "88%,90%"
- takeScreenshot: ${NAME}
