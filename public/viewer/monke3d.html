<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Monke 3D</title>
<!--
  OnlyMonkes 3D avatar viewer. Every Saga Monke is 16×16 pixel art, so the
  page builds a smooth 3D monke from the monke's own Arweave image at load time.
  Runs on its own so the web app (iframe) and the phone app (WebView, OTA)
  can both show it.
  - ?n=<monke number>: which monke (the app passes the holder's own).
  - "Use my camera": MediaPipe face tracking drives jaw, blinks and head.
    Video stays in this page; nothing is uploaded.
  - "Use my phone": a QR opens /viewer/cam on any phone, which tracks the face
    there and streams sealed face numbers back (phonecam.js). For computers
    without a webcam.
  - postMessage {type:"blendshapes", values, headRotation} from the host page
    drives it too (Avatar Room data channel), using the same blendshape names
    as src/lib/faceTracking.ts; {type:"monke", n} switches monke. Only
    numbers are read from messages.
-->
<style>
  :root { --bg: #0A0A0F; --text: #EDEDF3; --muted: #9A9AB0; --accent: #e91671; --line: rgba(255,255,255,0.12); }
  html, body { margin: 0; height: 100%; height: 100dvh; color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  body { background: radial-gradient(circle at 50% 38%, #232335, var(--bg) 70%) var(--bg); }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 14px max(16px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid #f5d34a; outline-offset: 2px; }
  form { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 3px 3px 3px 12px; }
  form label { color: var(--muted); }
  input { width: 64px; font: inherit; color: var(--text); background: transparent; border: 0; padding: 7px 4px; }
  form button { padding: 7px 12px; border-radius: 9px; }
  [hidden] { display: none !important; }
  .small { font-size: 12px; }
  #qr { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,10,15,0.82); padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); }
  #qr .card { width: 100%; max-width: 340px; display: grid; gap: 12px; justify-items: center; text-align: center; background: #14141f; border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; }
  #qr h2 { margin: 0; font-size: 18px; }
  #qr p { margin: 0; color: var(--muted); }
  #qr canvas { width: 220px; height: 220px; border-radius: 10px; background: #fff; }
  #qr .card button { width: 100%; }
  #status { position: fixed; top: 12px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px; pointer-events: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js",

<body>
<div id="status">Loading monke…</div>
<div class="bar">
  <form id="pick"><label for="num">Monke #</label><input id="num" inputmode="numeric" autocomplete="off" maxlength="5" /><button type="submit">Load</button></form>
  <button id="cam" disabled>Use my camera</button>
  <button id="phone" class="ghost" disabled>Use my phone</button>

</div>
<div id="qr" hidden role="dialog" aria-labelledby="qrTitle">
  <div class="card">
    <h2 id="qrTitle">Use your phone as the camera</h2>
    <canvas id="qrCanvas" width="220" height="220" aria-label="QR code to open on your phone"></canvas>
    <p id="qrState">Scan this with your phone's camera, then tap Start camera.</p>
    <p class="small">Only face movements are sent, encrypted. Video stays on the phone.</p>
    <button id="qrCopy" class="ghost">Copy link instead</button>
    <button id="qrClose" class="ghost">Close</button>
  </div>
</div>
<script type="module">
import * as THREE from "three";
import { newSession, phoneUrl, importKey, open, connect, startFaceTracking, cameraError } from "/viewer/phonecam.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const statusEl = document.getElementById("status");
const camBtn = document.getElementById("cam");
const phoneBtn = document.getElementById("phone");
const numInput = document.getElementById("num");
const setStatus = (t) => { statusEl.textContent = t; };

// ── Monke number → Arweave image (same table as src/lib/monkeMeme/monkeNumbers.ts) ──
const BASE_A = "https://arweave.net/8bJFg1KcX8M_ahz3wJplqdG4-8we_Ts1pTSi5wephHE";
const BASE_B = "https://arweave.net/2x92sGwXGIDCumAN1vawXd6CitHeqyjuZ1fUWOVmfsY";
const GIFS = new Set([8986, 8987, 8988]);
const BURNED = new Set([411, 2976, 3109, 3140, 3850, 3970, 4747, 4979, 5203, 5363, 5462, 5952, 6692, 6797, 7894]);
function imageFor(n) {
  if (!Number.isInteger(n) || n < 1 || n > 10014 || BURNED.has(n)) return null;
  return `${n >= 8989 ? BASE_B : BASE_A}/${n}.${GIFS.has(n) ? "gif" : "png"}`;
}

// ── Scene ──
const DEG = Math.PI / 180;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 14;
controls.maxDistance = 60;
// The model is made for the front: orbit at most 45° left or right, near eye level.
controls.minAzimuthAngle = -45 * (Math.PI / 180);
controls.maxAzimuthAngle = 45 * (Math.PI / 180);
controls.minPolarAngle = 70 * (Math.PI / 180);
controls.maxPolarAngle = 100 * (Math.PI / 180);

scene.add(new THREE.AmbientLight(0xffffff, 1.9));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(6, 10, 14);
scene.add(key);
const rim = new THREE.DirectionalLight(0xe91671, 1.1);
rim.position.set(-10, 4, -8);
scene.add(rim);

// Far enough back that the whole 16-wide monke fits a narrow phone screen too.
function resetView() {
  const halfFov = Math.atan(Math.tan((camera.fov * DEG) / 2) * Math.min(1, camera.aspect));
  const dist = Math.max(26, 7 / Math.tan(halfFov));
  camera.position.set(0.12 * dist, 0.06 * dist, dist);
  controls.target.set(0, -0.5, 0);
  controls.maxDistance = Math.max(60, dist * 1.6);
  controls.update();
}
resetView();
document.getElementById("reset").onclick = resetView;
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Pixel art → smooth 3D ──
// Standard monkes share one template: eyes at (7,9) and (10,9), mouth on
// row 11 at x 7–10, neck below row 11.
const EYES = [[7, 9], [10, 9]];
const MOUTH_ROW = 11, MOUTH_X = [7, 8, 9, 10];
const NECK_ROW = 12;
// The backdrop is slightly tinted noise around #22–#2c. Dark clothing is flat
// neutral black under #22 (e.g. #1234's hoodie #1c1e1e), so it stays solid.
const isBg = (r, g, b, a) => {
  if (a < 128) return true;
  const hi = Math.max(r, g, b), lo = Math.min(r, g, b);
  return hi >= 0x21 && hi <= 0x30 && lo >= 0x1b && hi - lo >= 3;
};

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("image"));
    img.src = url;
  });
}

function readGrid(img) {
  const c = document.createElement("canvas");
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const cell = c.width / 16;
  const px = [];
  for (let y = 0; y < 16; y++) {
    const row = [];
    for (let x = 0; x < 16; x++) {
      const d = ctx.getImageData(Math.floor((x + 0.5) * cell), Math.floor((y + 0.5) * cell), 1, 1).data;
      row.push([d[0], d[1], d[2], d[3]]);
    }
    px.push(row);
  }
  // Background is whatever bg-coloured pixels touch the border.
  const solid = px.map((r) => r.map(() => true));
  const q = [];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++)
    if ((x === 0 || y === 0 || x === 15 || y === 15) && isBg(...px[y][x])) { solid[y][x] = false; q.push([x, y]); }
  while (q.length) {
    const [x, y] = q.pop();
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx > 15 || ny > 15 || !solid[ny][nx]) continue;
      if (isBg(...px[ny][nx])) { solid[ny][nx] = false; q.push([nx, ny]); }
    }
  }
  return { px, solid };
}

const same = (a, b) => a[0] === b[0] && a[1] === b[1] && a[2] === b[2];
const css = (p) => `rgb(${p[0]},${p[1]},${p[2]})`;

// The monke is one rounded, "inflated" shape per part (head, body): a mesh with
// S cells per art pixel whose outline follows the art without stair steps and
// whose thickness rises smoothly from the outline. The on-chain pixel art is
// painted on the front, crisp (nearest-neighbour), so it stays the real monke.
// It is built to be seen from the front, up to 45° either side.
const S = 8, N = 16 * S, W = N + 1;
const CAVITY = [58, 13, 22];
// front: gentle curve carrying the art (steep walls would stretch the pixels);
// back: a deeper round bulge in the part's own colour.
const HEAD = { front: 2.2, back: 3.0, R: 3.4, dome: 0.5 };
const BODY = { front: 1.3, back: 2.2, R: 2.6, dome: 0 };
const NECK_Y = 8 - NECK_ROW; // head pivot, in the centred art coordinates (y up)

// Vertex (gx, gy) is inside when the bilinear blend of the pixel-centre
// solid mask is over the threshold: that rounds the stair steps off.
function silhouette(solid) {
  const s = (x, y) => (x < 0 || y < 0 || x > 15 || y > 15 ? 0 : solid[y][x] ? 1 : 0);
  const inside = new Uint8Array(W * W);
  for (let gy = 0; gy <= N; gy++) for (let gx = 0; gx <= N; gx++) {
    const u = gx / S - 0.5, v = gy / S - 0.5;
    const x0 = Math.floor(u), y0 = Math.floor(v), fx = u - x0, fy = v - y0;
    const f = s(x0, y0) * (1 - fx) * (1 - fy) + s(x0 + 1, y0) * fx * (1 - fy) + s(x0, y0 + 1) * (1 - fx) * fy + s(x0 + 1, y0 + 1) * fx * fy;
    inside[gy * W + gx] = f > 0.45 ? 1 : 0;
  }
  return inside;
}

// Distance (in art pixels) from each inside vertex to the outline; 0 on it.
function outlineDistance(inside) {
  const isIn = (gx, gy) => gx >= 0 && gy >= 0 && gx <= N && gy <= N && inside[gy * W + gx] === 1;
  const edge = [];
  for (let gy = 0; gy <= N; gy++) for (let gx = 0; gx <= N; gx++)
    if (isIn(gx, gy) && !(isIn(gx + 1, gy) && isIn(gx - 1, gy) && isIn(gx, gy + 1) && isIn(gx, gy - 1))) edge.push(gx, gy);
  const D = new Float32Array(W * W);
  for (let gy = 0; gy <= N; gy++) for (let gx = 0; gx <= N; gx++) {
    if (!isIn(gx, gy)) continue;
    let m = Infinity;
    for (let i = 0; i < edge.length; i += 2) {
      const dx = edge[i] - gx, dy = edge[i + 1] - gy, q = dx * dx + dy * dy;
      if (q < m) m = q;
    }
    D[gy * W + gx] = Math.sqrt(m) / S;
  }
  return D;
}

// Heights from the outline distance: flat across the middle so the face stays
// readable, plus an optional gentle dome around the part's centre.
function heights(d, p, gx, gy, centre) {
  const t = Math.min(d / p.R, 1);
  let front = p.front * (1 - (1 - t) * (1 - t));
  if (p.dome && centre) {
    const dx = (gx / S - centre.x) / centre.rx, dy = (gy / S - centre.y) / centre.ry;
    front += p.dome * t * Math.max(0, 1 - dx * dx - dy * dy);
  }
  return [front, p.back * Math.sqrt(1 - (1 - t) * (1 - t))];
}

// Fill background pixels with the nearest solid colour, so the softened
// outline never samples the dark backdrop.
function filledColors(px, solid) {
  const c = px.map((r, y) => r.map((p, x) => (solid[y][x] ? p : null)));
  for (let pass = 0; pass < 16; pass++) {
    let changed = false;
    const next = c.map((r) => r.slice());
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      if (c[y][x]) continue;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const p = c[y + dy]?.[x + dx];
        if (p) { next[y][x] = p; changed = true; break; }
      }
    }
    for (let y = 0; y < 16; y++) c[y] = next[y];
    if (!changed) break;
  }
  return c.map((r) => r.map((p) => p || [40, 40, 48, 255]));
}

function pixelTexture(colors, w, h) {
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { ctx.fillStyle = css(colors[y][x]); ctx.fillRect(x, y, 1, 1); }
  const t = new THREE.CanvasTexture(cv);
  t.magFilter = THREE.NearestFilter;
  t.minFilter = THREE.NearestFilter;
  t.generateMipmaps = false;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// Colour for the back of a part. Monkes face right, so the back of the head
// (or body) is the leftmost pixels of each row: take the most common of the
// first two solid pixels per row.
function partColor(px, solid, fromRow, toRow) {
  const count = new Map();
  for (let y = fromRow; y < toRow; y++) {
    let seen = 0;
    for (let x = 0; x < 16 && seen < 2; x++) {
      if (!solid[y][x]) continue;
      seen++;
      const k = css(px[y][x]);
      count.set(k, (count.get(k) || 0) + 1);
    }
  }
  let best = "rgb(90,70,60)", n = 0;
  for (const [k, c] of count) if (c > n) { best = k; n = c; }
  return best;
}

// One part as a closed mesh: front (art) + back (flat colour), meeting at the
// outline, plus a flat cap where the part is cut at the neck.
// `inside` is the part's own outline (the head must not borrow the body's
// shape under the chin); D comes from the whole figure, for thickness.
function partMesh(inside, D, p, rows, centre, frontMat, backMat, offsetY, capFacesUp) {
  const pos = new Float32Array(W * W * 2 * 3), uv = new Float32Array(W * W * 2 * 2);
  const hgt = new Float32Array(W * W);
  for (let gy = 0; gy <= N; gy++) for (let gx = 0; gx <= N; gx++) {
    const i = gy * W + gx;
    const [hf, hb] = inside[i] ? heights(D[i], p, gx, gy, centre) : [0, 0];
    hgt[i] = hf;
    const x = gx / S - 8, y = 8 - gy / S - offsetY;
    pos.set([x, y, hf], i * 3);
    pos.set([x, y, -hb], (W * W + i) * 3);
    uv.set([gx / N, 1 - gy / N], i * 2);
    uv.set([gx / N, 1 - gy / N], (W * W + i) * 2);
  }
  const front = [], back = [];
  const inRows = (gy) => gy >= rows[0] * S && gy + 1 <= rows[1] * S;
  for (let gy = 0; gy < N; gy++) {
    if (!inRows(gy)) continue;
    for (let gx = 0; gx < N; gx++) {
      const a = gy * W + gx, b = a + 1, c = a + W, d = c + 1;
      // Cells touching the shape slope down to zero thickness at the outside
      // vertices: front and back meet there, so the rim is closed and smooth.
      if (inside[a] || inside[b] || inside[c]) { front.push(a, c, b); back.push(W * W + a, W * W + b, W * W + c); }
      if (inside[b] || inside[c] || inside[d]) { front.push(b, c, d); back.push(W * W + b, W * W + d, W * W + c); }
    }
  }
  // Cap along the cut row.
  const cut = (capFacesUp ? rows[0] : rows[1]) * S;
  if (cut > 0 && cut < N) for (let gx = 0; gx < N; gx++) {
    const f0 = cut * W + gx, f1 = f0 + 1;
    if (!inside[f0] && !inside[f1]) continue;
    const b0 = W * W + f0, b1 = W * W + f1;
    if (capFacesUp) back.push(f0, f1, b0, f1, b1, b0);
    else back.push(f0, b0, f1, f1, b0, b1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
  g.setIndex([...front, ...back]);
  g.addGroup(0, front.length, 0);
  g.addGroup(front.length, back.length, 1);
  g.computeVertexNormals();
  return { mesh: new THREE.Mesh(g, [frontMat, backMat]), hgt, inside };
}

// A piece of the head's front surface over art pixels [x0, x0+w) × [y0, y0+h),
// lifted a hair, so moving parts (jaw, eyelids) hug the curve at any angle.
// Local y is measured from the patch's top edge. It borrows the surface's own
// normals, so it is lit exactly like the face under it (no visible seam).
function surfacePatch(part, x0, y0, w, h, mat, lift) {
  const cols = w * S, rows = h * S;
  const nrm = part.mesh.geometry.getAttribute("normal").array;
  const pos = [], uv = [], nor = [], idx = [];
  for (let j = 0; j <= rows; j++) for (let i = 0; i <= cols; i++) {
    const gx = x0 * S + i, gy = y0 * S + j, k = gy * W + gx;
    pos.push(gx / S - 8, -j / S, part.hgt[k] + lift);
    nor.push(nrm[k * 3], nrm[k * 3 + 1], nrm[k * 3 + 2]);
    uv.push(i / cols, 1 - j / rows);
  }
  // Only cells fully inside the outline: the rim slope would poke past the face.
  const ins = (i, j) => part.inside[(y0 * S + j) * W + x0 * S + i] === 1;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    if (!(ins(i, j) && ins(i + 1, j) && ins(i, j + 1) && ins(i + 1, j + 1))) continue;
    const a = j * (cols + 1) + i, b = a + 1, c = a + cols + 1, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return new THREE.Mesh(g, mat);
}

let monke = null;

function disposeMonke() {
  if (!monke) return;
  scene.remove(monke.root);
  monke.root.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry.dispose();
    for (const m of [].concat(o.material)) { m.map?.dispose(); m.dispose(); }
  });
  monke = null;
}

function buildMonke({ px, solid }) {
  disposeMonke();
  const skin = css(px[8][8]);
  // Template check: the moving parts only switch on where they'll look right
  // (sunglasses, masks and odd 1/1s keep their faces still).
  const eyesOk = EYES.every(([x, y]) => solid[y][x]) && same(px[9][7], px[9][10]) && !same(px[9][7], px[9][8]) && same(px[9][8], px[9][9]);
  const jawOk = MOUTH_X.every((x) => solid[MOUTH_ROW][x]) && same(px[10][8], px[10][9]);

  const colors = filledColors(px, solid);
  const art = colors.map((r) => r.slice());
  if (jawOk) for (const x of MOUTH_X) art[MOUTH_ROW][x] = CAVITY; // the jaw piece covers it until the mouth opens
  const map = pixelTexture(art, 16, 16);
  const frontMat = new THREE.MeshStandardMaterial({ map, roughness: 0.85, metalness: 0 });

  const D = outlineDistance(silhouette(solid));
  // Each part's own outline, carried straight across the neck cut so the cut isn't pinched.
  const headInside = silhouette(solid.map((r, y) => (y < NECK_ROW ? r : solid[NECK_ROW - 1])));
  const bodyInside = silhouette(solid.map((r, y) => (y >= NECK_ROW ? r : solid[NECK_ROW])));
  // Head centre for the dome: middle of the head's solid pixels.
  let sx = 0, sy = 0, n = 0, minX = 16, maxX = 0, minY = 16;
  for (let y = 0; y < NECK_ROW; y++) for (let x = 0; x < 16; x++) if (solid[y][x]) { sx += x + 0.5; sy += y + 0.5; n++; minX = Math.min(minX, x); maxX = Math.max(maxX, x + 1); minY = Math.min(minY, y); }
  const centre = n ? { x: sx / n, y: sy / n, rx: Math.max(2, (maxX - minX) / 2), ry: Math.max(2, (NECK_ROW - minY) / 2) } : null;

  const headBack = new THREE.MeshStandardMaterial({ color: partColor(px, solid, 0, NECK_ROW), roughness: 0.9, metalness: 0 });
  const bodyBack = new THREE.MeshStandardMaterial({ color: partColor(px, solid, NECK_ROW, 16), roughness: 0.9, metalness: 0 });
  const head = partMesh(headInside, D, HEAD, [0, NECK_ROW], centre, frontMat, headBack, NECK_Y, false);
  const body = partMesh(bodyInside, D, BODY, [NECK_ROW, 16], null, frontMat, bodyBack, 0, true);

  const root = new THREE.Group();
  const headGroup = new THREE.Group();
  headGroup.position.y = NECK_Y;
  headGroup.add(head.mesh);

  let jawMesh = null, jawY = 0;
  if (jawOk) {
    const mouthTex = pixelTexture([MOUTH_X.map((x) => colors[MOUTH_ROW][x])], MOUTH_X.length, 1);
    const mouthMat = new THREE.MeshStandardMaterial({ map: mouthTex, roughness: 0.85, metalness: 0 });
    // The mouth opens in place: this chin strip shrinks toward its bottom edge
    // and uncovers the dark mouth painted under it (no part slides off the face).
    jawMesh = surfacePatch(head, MOUTH_X[0], MOUTH_ROW, MOUTH_X.length, 1, mouthMat, 0.02);
    jawMesh.geometry.translate(0, 1, 0);
    jawY = 8 - MOUTH_ROW - NECK_Y - 1;
    jawMesh.position.y = jawY;
    headGroup.add(jawMesh);
  }
  const lidMat = new THREE.MeshStandardMaterial({ color: skin, roughness: 0.85, metalness: 0 });
  const lids = eyesOk ? EYES.map(([x, y]) => {
    const lid = surfacePatch(head, x, y, 1, 1, lidMat, 0.03);
    lid.userData.top = 8 - y - NECK_Y;
    lid.position.y = lid.userData.top;
    lid.scale.y = 0.001;
    lid.userData.side = x + 0.5 - 8;
    headGroup.add(lid);
    return lid;
  }) : [];

  root.add(body.mesh, headGroup);
  scene.add(root);
  monke = { root, headGroup, jawMesh, jawY, lids, jaw: 0, blinkL: 0, blinkR: 0 };
}

let current = null;
let loadSeq = 0;
async function showMonke(n) {
  const url = imageFor(n);
  if (!url) { setStatus(`#${n} isn't a live Saga Monke`); return; }
  const seq = ++loadSeq;
  setStatus(`Loading #${n}…`);
  try {
    const img = await loadImage(url);
    if (seq !== loadSeq) return;
    buildMonke(readGrid(img));
    current = n;
    numInput.value = String(n);
    camBtn.disabled = false;
    phoneBtn.disabled = false;
    setStatus("");
  } catch {
    if (seq === loadSeq) setStatus(`Couldn't load #${n}. Check your connection and try again.`);
  }
}

document.getElementById("pick").addEventListener("submit", (e) => {
  e.preventDefault();
  const n = parseInt(numInput.value.replace(/\D/g, ""), 10);
  if (n && n !== current) showMonke(n);
});

// ── Face → monke ──
let face = null;            // latest { values, headRotation }
let faceAt = 0;             // when it arrived (ms)
const clamp01 = (x) => Math.max(0, Math.min(1, Number(x) || 0));

function applyFace(dt) {
  if (!monke) return;
  const t = performance.now() / 1000;
  const live = face && performance.now() - faceAt < 1500;
  const k = 1 - Math.exp(-dt * 14);
  let jaw = 0, bl = 0, br = 0, rx = 0, ry = 0, rz = 0;
  if (live) {
    const v = face.values, r = face.headRotation || {};
    jaw = clamp01(v.jawOpen * 1.6);
    bl = clamp01(v.eyeBlinkLeft * 1.3);
    br = clamp01(v.eyeBlinkRight * 1.3);
    // Mirror yaw/roll so the monke moves like a mirror image of you.
    // Built to be seen from the front: at most 45° left or right.
    rx = Math.max(-20, Math.min(20, Number(r.x) || 0)) * DEG;
    ry = -Math.max(-45, Math.min(45, Number(r.y) || 0)) * DEG;
    rz = -Math.max(-20, Math.min(20, Number(r.z) || 0)) * DEG;
  } else {
    // Idle: slow blink and a little sway when nothing is driving it.
    bl = br = (t % 4) < 0.14 ? 1 : 0;
    rx = Math.sin(t * 0.8) * 0.04;
    ry = Math.sin(t * 0.45) * 0.12;
  }
  monke.jaw += (jaw - monke.jaw) * k;
  monke.blinkL += (bl - monke.blinkL) * Math.min(1, k * 2);
  monke.blinkR += (br - monke.blinkR) * Math.min(1, k * 2);
  if (monke.jawMesh) monke.jawMesh.scale.y = Math.max(0.08, 1 - monke.jaw * 0.85);
  // The monke faces you, so its left eye is on screen right (higher x).
  monke.lids.forEach((lid) => {
    const b = lid.userData.side > 0 ? monke.blinkL : monke.blinkR;
    lid.scale.y = Math.max(0.001, b); // patches hang from their top edge
  });
  const h = monke.headGroup.rotation;
  h.x += (rx - h.x) * k;
  h.y += (ry - h.y) * k;
  h.z += (rz - h.z) * k;
}

function takeFace(values, headRotation) {
  if (!values || typeof values !== "object") return;
  const clean = {};
  for (const [k, x] of Object.entries(values)) if (/^[a-zA-Z]{2,24}$/.test(k)) clean[k] = clamp01(x);
  face = { values: clean, headRotation: headRotation && typeof headRotation === "object" ? headRotation : {} };
  faceAt = performance.now();
}

// Host page (app / Avatar Room) can drive the monke. Data only — never code.
function onHostMessage(e) {
  let d = e.data;
  if (typeof d === "string") { try { d = JSON.parse(d); } catch { return; } }
  if (!d || typeof d !== "object") return;
  if (d.type === "blendshapes") takeFace(d.values, d.headRotation);
  else if (d.type === "monke" && Number.isInteger(d.n) && d.n !== current) showMonke(d.n);
}
addEventListener("message", onHostMessage);
document.addEventListener("message", onHostMessage); // Android WebView

// ── Own camera ──
let tracking = false;
camBtn.onclick = async () => {
  if (tracking) return;
  camBtn.disabled = true;
  setStatus("Starting camera…");
  try {
    await startFaceTracking(document.createElement("video"), takeFace);
    tracking = true;
    camBtn.textContent = "Camera on";
    setStatus("");
  } catch (e) {
    camBtn.disabled = false;
    setStatus(e?.name === "NotFoundError" || e?.name === "OverconstrainedError" ? "No camera on this computer. Tap Use my phone instead." : cameraError(e));
  }
};

// ── Phone as the camera ──
const qr = document.getElementById("qr");
const qrState = document.getElementById("qrState");
let phone = null; // { relay, session }
phoneBtn.onclick = async () => {
  if (phone) { qr.hidden = false; return; }
  phoneBtn.disabled = true;
  try {
    const session = newSession();
    const key = await importKey(session.key);
    const QR = await import("https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm");
    await QR.toCanvas(document.getElementById("qrCanvas"), phoneUrl(session), { width: 220, margin: 2, errorCorrectionLevel: "M" });
    const relay = connect({
      room: session.room,
      role: "viewer",
      onStatus: (st) => {
        if (st.camera) {
          qr.hidden = true;
          phoneBtn.textContent = "Phone connected";
          setStatus("");
        } else {
          phoneBtn.textContent = "Use my phone";
          qrState.textContent = "Scan this with your phone's camera, then tap Start camera.";
        }
      },
      onFrame: async (data) => {
        const f = await open(key, data);
        if (f) takeFace(f.values, f.headRotation);
      },
      onState: (st) => {
        if (st === "expired") { phone = null; phoneBtn.textContent = "Use my phone"; setStatus("The phone link expired. Tap Use my phone for a new one."); }
        else if (st === "closed") qrState.textContent = "Reconnecting…";
      },
    });
    phone = { relay, session };
    qr.hidden = false;
    qr.dataset.url = phoneUrl(session);
  } catch {
    setStatus("Couldn't make the phone link. Check your connection and try again.");
  } finally {
    phoneBtn.disabled = false;
  }
};
document.getElementById("qrClose").onclick = () => { qr.hidden = true; };
// For phones whose camera won't open links: send yourself the link (it holds the key, so only to yourself).
document.getElementById("qrCopy").onclick = async (e) => {
  try { await navigator.clipboard.writeText(qr.dataset.url || ""); e.target.textContent = "Copied. Open it on your phone"; }
  catch { e.target.textContent = "Couldn't copy"; }
};
addEventListener("keydown", (e) => { if (e.key === "Escape") qr.hidden = true; });

// ── Start ──
const asked = parseInt(new URLSearchParams(location.search).get("n") || "", 10);
let first = asked;
while (!imageFor(first)) first = 1 + Math.floor(Math.random() * 8888);
showMonke(first);

let prev = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min(0.1, (now - prev) / 1000);
  prev = now;
  applyFace(dt);
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
