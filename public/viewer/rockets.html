<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Banana Rockets</title>
<!--
  Banana Rockets: an original one-thumb space game for Saga Monke holders. Drag
  back and let go to launch your banana rocket, slingshot round planets, land
  softly, reach the Moon. One daily course for everyone (built from the date in
  rockets-sim.js, no server), plus practice courses. ?n=<monke number> puts that
  monke in the cockpit and paints the rocket from its traits. In the app a
  finished run posts {type:"rockets", event:"clear", …} to the host.
-->
<style>
  :root { --bg: #05040c; --text: #EDEDF3; --muted: #9a9ab0; --accent: #E91671; --banana: #FFD23F; --panel: rgba(12,10,22,0.86); --line: #3a3150; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.3 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); right: max(56px, calc(env(safe-area-inset-right) + 56px)); display: flex; align-items: center; gap: 10px; pointer-events: none; }
  #face { width: 40px; height: 40px; image-rendering: pixelated; background: #1d1828; border: 2px solid var(--line); border-radius: 6px; flex: none; }
  .stat { display: grid; justify-items: start; min-width: 44px; text-shadow: 0 1px 0 #000; }
  .stat b { font-size: 17px; letter-spacing: 0.5px; }
  .stat span { font-size: 9px; color: var(--muted); text-transform: uppercase; }
  #time b { color: #fff; min-width: 64px; } #launches b { color: #8fd3ff; } #bananas b { color: var(--banana); }
  #pause { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.2); background: rgba(12,10,18,0.6); color: #fff; font: 700 14px/1 ui-monospace, monospace; border-radius: 6px; z-index: 3; touch-action: none; }
  #toast { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; text-shadow: 0 2px 0 #000; font-weight: 700; font-size: 18px; color: var(--banana); letter-spacing: 1px; transition: opacity .5s; opacity: 0; }
  #toast.on { opacity: 1; }
  #toast small { display: block; font-size: 12px; color: var(--text); font-weight: 400; letter-spacing: 0; margin-top: 4px; }
  #hint { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); text-align: center; color: var(--muted); font-size: 12px; pointer-events: none; transition: opacity .8s; text-shadow: 0 1px 0 #000; }
  #hint.gone { opacity: 0; }
  .card { position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%); min-width: 240px; max-width: calc(100vw - 40px); padding: 18px 20px 16px; background: var(--panel); border: 2px solid var(--line); border-radius: 10px; box-shadow: 0 0 0 2px #000, 0 10px 0 rgba(0,0,0,0.45); display: grid; gap: 9px; justify-items: center; text-align: center; z-index: 4; }
  .card[hidden] { display: none; }
  .card h1 { margin: 0; font-size: 26px; color: var(--banana); letter-spacing: 2px; }
  .card .big { font-size: 34px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .card .dim { color: var(--muted); }
  .card .tag { background: var(--banana); color: #1a1408; font-weight: 700; padding: 2px 8px; letter-spacing: 1px; border-radius: 3px; }
  .card .stats { display: grid; grid-template-columns: auto auto; gap: 3px 18px; color: var(--muted); }
  .card .stats b { color: #fff; text-align: right; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .card button, #menu button { font: 700 14px/1 ui-monospace, monospace; padding: 12px 14px; background: #1d1828; color: var(--text); border: 2px solid var(--line); border-radius: 6px; }
  .card button.go { background: var(--banana); color: #1a1408; border-color: #000; }
  .card button:active, #menu button:active { background: #2a2436; }
  .card .pilot { display: flex; align-items: center; gap: 10px; }
  .card .pilot canvas { width: 48px; height: 48px; image-rendering: pixelated; border: 2px solid var(--line); border-radius: 6px; background: #1d1828; }
  .card .swatch { display: inline-block; width: 12px; height: 12px; border: 2px solid #000; border-radius: 2px; vertical-align: -2px; margin-right: 4px; }
  .card .how { color: var(--text); font-size: 12px; line-height: 1.5; }
  .card .cta { color: var(--banana); animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #menu { position: fixed; inset: 0; background: rgba(5,4,9,0.78); display: grid; place-items: center; z-index: 5; }
  #menu[hidden] { display: none; }
  #menu > div { display: grid; gap: 9px; min-width: 230px; text-align: center; }
  #menu h1 { margin: 0 0 6px; color: var(--banana); font-size: 22px; letter-spacing: 2px; }
  #menu .courses { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #menu button.on { border-color: var(--banana); color: var(--banana); }
  @media (max-height: 520px) { .card { top: 50%; padding: 12px 16px; gap: 6px; } .card h1 { font-size: 22px; } .card .big { font-size: 28px; } }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <canvas id="face" width="16" height="16"></canvas>
  <div class="stat" id="time"><b>0:00.0</b><span>time</span></div>
  <div class="stat" id="launches"><b>0</b><span>launches</span></div>
  <div class="stat" id="bananas"><b>0/3</b><span>bananas</span></div>
</div>
<button id="pause" aria-label="Menu">II</button>
<div id="toast"></div>
<div id="hint">Drag back and let go to launch</div>
<div class="card" id="card" hidden></div>
<div id="menu" hidden>
  <div>
    <h1>PAUSED</h1>
    <button id="resume">Resume</button>
    <button id="restart">Restart course</button>
    <div class="courses" id="courses"></div>
    <button id="sound">Sound: on</button>
  </div>
</div>
<script type="module" src="/viewer/rockets.js"></script>
</body>
</html>
