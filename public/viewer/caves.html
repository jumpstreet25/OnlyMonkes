<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>MonkeCaves</title>
<!--
  MonkeCaves (prototype): an original retro first-person shooter for Saga Monke
  holders. Our own raycaster (caves.js) draws a 320×200 picture that is scaled
  up with crisp pixels. ?n=<monke number> puts that monke's PFP in the status
  bar. The app loads it in a WebView (phone) or an iframe (web); a cleared level
  posts {type:"caves", event:"clear", …} to the host for rewards later.
-->
<style>
  :root { --bg: #07070b; --text: #EDEDF3; --muted: #9a9ab0; --accent: #E91671; --banana: #FFD23F; }
  html, body { margin: 0; height: 100%; background: linear-gradient(var(--bg) 55%, #15111d); color: var(--text); font: 13px/1.3 ui-monospace, Menlo, Consolas, monospace; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #view { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: #000; }
  #hud { display: flex; align-items: center; gap: 14px; padding: 6px 10px; background: #15121c; border-top: 2px solid #2a2436; box-sizing: border-box; }
  #face { width: 56px; height: 56px; image-rendering: pixelated; background: #2a2436; border: 2px solid #3a3150; }
  .stat { display: grid; justify-items: center; min-width: 52px; }
  .stat b { font-size: 20px; letter-spacing: 1px; }
  .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; }
  #hp b { color: #ff5d6c; } #ammo b { color: #3cdcaa; } #bananas b { color: var(--banana); }
  #msg { position: fixed; left: 50%; top: 32%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; text-shadow: 0 2px 0 #000; }
  #msg h1 { margin: 0 0 6px; font-size: 28px; color: var(--banana); letter-spacing: 2px; }
  #msg p { margin: 0; color: var(--text); }
  #pad, #turn, #fire { position: fixed; touch-action: none; }
  #pad { left: max(18px, env(safe-area-inset-left)); bottom: max(18px, env(safe-area-inset-bottom)); width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.12); }
  #knob { position: absolute; left: 41px; top: 41px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,0.22); }
  #turn { right: 0; top: 0; width: 50%; height: 100%; }
  #fire { right: max(22px, env(safe-area-inset-right)); bottom: max(34px, env(safe-area-inset-bottom)); width: 86px; height: 86px; border-radius: 50%; background: rgba(233,22,113,0.55); border: 2px solid rgba(255,255,255,0.25); color: #fff; font-weight: 700; display: grid; place-items: center; }
  .desktop #pad, .desktop #fire, .desktop #turn { display: none; }
  #help { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 120px); text-align: center; color: var(--muted); font-size: 11px; pointer-events: none; transition: opacity .8s; }
  #help.gone { opacity: 0; }
  #msg.card { top: 30%; min-width: 230px; max-width: calc(100vw - 48px); padding: 16px 18px 14px; background: rgba(12,10,18,0.88); border: 2px solid #3a3150; box-shadow: 0 0 0 2px #000, 0 8px 0 rgba(0,0,0,0.5); display: grid; gap: 8px; justify-items: center; }
  #msg.card h1 { margin: 0; }
  #msg .big { font-size: 34px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  #msg .tag { background: var(--banana); color: #1a1408; font-weight: 700; padding: 2px 8px; letter-spacing: 1px; }
  #msg .dim { color: var(--muted); }
  #msg .row { display: flex; gap: 14px; color: var(--text); }
  #msg .stats { display: grid; grid-template-columns: auto auto; gap: 2px 18px; color: var(--muted); }
  #msg .stats b { color: #fff; text-align: right; }
  #msg .weapon { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #fff; }
  #msg .weapon i { width: 14px; height: 14px; border: 2px solid #000; box-shadow: 0 0 8px currentColor; }
  #msg .cta { margin-top: 4px; color: var(--banana); animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  #pause { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); width: 40px; height: 40px; border: 2px solid rgba(255,255,255,0.2); background: rgba(12,10,18,0.6); color: #fff; font: 700 14px/1 ui-monospace, monospace; z-index: 3; touch-action: none; }
  #mapbtn { position: fixed; top: max(8px, env(safe-area-inset-top)); right: calc(max(8px, env(safe-area-inset-right)) + 48px); height: 40px; padding: 0 8px; border: 2px solid rgba(255,255,255,0.2); background: rgba(12,10,18,0.6); color: #fff; font: 700 12px/1 ui-monospace, monospace; z-index: 3; touch-action: none; }
  #menu { position: fixed; inset: 0; background: rgba(5,4,9,0.78); display: grid; place-items: center; z-index: 4; }
  #menu[hidden] { display: none; }
  #menu div { display: grid; gap: 10px; min-width: 220px; text-align: center; }
  #menu h1 { margin: 0 0 6px; color: var(--banana); font-size: 24px; letter-spacing: 2px; }
  #menu button { font: 700 15px/1 ui-monospace, monospace; padding: 14px; background: #1d1828; color: var(--text); border: 2px solid #3a3150; }
  #menu button:active { background: #2a2436; }
  #menu .slider { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 12px 14px; background: #1d1828; border: 2px solid #3a3150; color: var(--text); font: 700 15px/1 ui-monospace, monospace; text-align: left; }
  #menu .slider span { color: var(--banana); }
  #menu .slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--banana); }
  #menu [hidden] { display: none; }
  /* Landscape phones: two columns so every setting fits without scrolling. */
  @media (max-height: 520px) {
    #menu { overflow-y: auto; }
    #menu div { grid-template-columns: 1fr 1fr; gap: 8px; min-width: min(560px, 90vw); }
    #menu h1 { grid-column: 1 / -1; font-size: 20px; margin: 0; }
    #menu button { padding: 11px; }
    #menu .slider { padding: 8px 12px; gap: 4px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="view" width="320" height="200"></canvas>
  <div id="hud">
    <canvas id="face" width="16" height="16"></canvas>
    <div class="stat" id="hp"><b>100</b><span>health</span></div>
    <div class="stat" id="ammo"><b>50</b><span>ammo</span></div>
    <div class="stat" id="bananas"><b>0</b><span>bananas</span></div>
    <div class="stat" id="clock"><b>0:00</b><span>time</span></div>
  </div>
</div>
<div id="msg"></div>
<div id="help"></div>
<div id="turn"></div>
<div id="pad"><div id="knob"></div></div>
<div id="fire">FIRE</div>
<button id="pause" aria-label="Pause">II</button>
<button id="mapbtn" aria-label="Map">MAP</button>
<div id="menu" hidden><div>
  <h1>PAUSED</h1>
  <button id="m-resume">Resume</button>
  <button id="m-restart">Restart this cave</button>
  <button id="m-sound">Sound: on</button>
  <label id="m-sensrow" class="slider">Turn speed <span id="m-sensv">1.0×</span><input id="m-sens" type="range" min="0.4" max="2.2" step="0.1" /></label>
  <button id="m-assist">Aim assist: on</button>
  <button id="m-tilt">Tilt to aim: off</button>
</div></div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js" } }
</script>
<script type="module" src="/viewer/caves.js"></script>
</body>
</html>
