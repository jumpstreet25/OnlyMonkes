  catalog:
    en-US:
      name: >-
        OnlyMonkes
      short_description: >-
        Saga Monkes social + AI trading app — free Genesis Chat for Genesis Token holders
      long_description: >-
        OnlyMonkes is the social and trading hub for the Saga Monkes community on Solana Mobile, with two tiers of access:

        GENESIS CHAT — free for any Solana Mobile Genesis Token holder (Saga Genesis Token or Seeker Genesis Token). Connect your wallet to join a read-only community feed with Banana Shop and Leaderboard access — no Saga Monkes NFT required.

        FULL ACCESS — connect a wallet holding a Saga Monkes NFT to unlock every premium feature below: real-time encrypted messaging, AI-powered trading signals, avatar rooms, video calls, tipping, swaps, and the peer-to-peer NFT marketplace.

        Both tiers verify ownership on-chain automatically — no manual approval, no waiting.

        PREMIUM FEATURES (Saga Monkes NFT required):

        🐒 GROUP CHAT — Real-time encrypted group messaging powered by XMTP v5 MLS protocol. Send text, GIFs, images, videos, stickers and reactions. Reply to messages, mention users with @username, and track $TOKEN prices inline.

        💬 DIRECT MESSAGES — Private 1-on-1 encrypted DMs and DM groups with any verified holder. Full message history, typing indicators, read receipts, and push notifications.

        🎭 AVATAR ROOMS & VIDEO CALLS — Animated NFT PFP avatar rooms with Google ML Kit face tracking, plus multi-person video calls built on LiveKit WebRTC. Sticker reactions via data channel, PiP mode, Krisp AI noise filter, and speaking indicators.

        💸 TIPPING & SWAPS — Send $SKR tokens with /tip (100% to recipient, no platform fee). Trade any Solana token via /buy /sell /swap: in DM with an enrolled hot wallet the bot signs and submits the swap on-chain with a 3% fee on realized gains only (no fee on losses); without an enrolled hot wallet the same commands generate a fee-free Jupiter web URL. One-tap Solana Actions (Blinks) render interactive swap cards directly in chat — fee-free. In-app token swap UI takes a 3% fee on realized gains only.

        🤖 AI TRADING AGENT — AI Agent #9385 monitors 100+ Solana tokens 24/7 with multi-timeframe technical analysis (RSI, MACD, EMA, Bollinger Bands, Ichimoku, Fibonacci). Dedicated MonkeTrades, MonkeBets, and MonkePredictions alert channels. AutonoMonke autonomous trading takes 5% on realized gains only.

        🐒 MONKEMARKETS — Peer-to-peer Saga Monkes NFT trading with atomic Solana swaps. 2% platform fee per sale. Trait filtering, Magic Eden floor pricing, and guest browsing.

        🍌 BANANA SHOP — Earn bananas daily and spend them on chat cosmetics: neon bubble glows, gold names, PFP auras, pulse frames, and full app themes. Balance and purchases stored locally per wallet, with manual restore from previous device available in Settings.

        🌍 MONKE GLOBE — Interactive 3D globe showing where fellow Monkes are located worldwide, plus Solana ecosystem events with RSVP. Also mirrored to a public companion site at monke-globe.pages.dev.

        🖼 FARCASTER FRAMES — Share OnlyMonkes trading alerts as interactive Farcaster Frames; community gets a tappable view of TA setups outside the app.

        🏆 cNFT BADGES — Earn compressed NFT milestone badges (First Message, Legendary Streak, Top Monke) minted to your wallet via Helius.

        📎 E2E FILE SHARING — Send files with native XMTP RemoteAttachment codec for end-to-end encrypted file transfers.

        📅 COMMUNITY EVENTS — Browse and create OnlyMonkes community events via the built-in calendar.

        🔔 PUSH NOTIFICATIONS — Real-time alerts for messages, mentions, reactions, live rooms, NFT sales, and TA trading signals.

        🛡 SECURITY & PRIVACY — All messages end-to-end encrypted via XMTP MLS. Free-RASP runtime protection (root/jailbreak/Frida detection). Per-user encrypted backend memory (AES-256-GCM, per-wallet salted) for AutonoMonke vault state and trading history. Encrypted nightly backups for disaster recovery.

        🌟 ACCESSIBILITY — Screen reader support, dynamic type sizing, and high-contrast mode.

        REQUIREMENTS: Compatible Solana wallet (Phantom, Solflare) on Seeker or Saga device. A Solana Mobile Genesis Token unlocks Genesis Chat; a Saga Monkes NFT unlocks full premium access. Users must be 18+. Full legal terms at https://onlymonkes-actions.jumpstreet25.workers.dev/legal
      new_in_version: >-
        v3.0.3: Major stability fix for a native crash that could occur during app updates and Avatar Room use. New: MonkeGlobe now has a public companion site (monke-globe.pages.dev) showing real Saga Monkes community locations and events with RSVP — share your location or post an event in-app and it appears there too. In-app "Update Ready" prompt — apply a downloaded update with a tap, no more force-closing the app. More reliable group join for new installs. Genesis Chat layout and header fixes. Previous: v3.0.1 introduced Genesis Chat — a new tier for Saga Genesis Token or Seeker Genesis Token holders who don't yet hold a Saga Monke: a read-only community feed plus Banana Shop and Leaderboard access, with a one-tap switch for holders who have both. Wallet-bound messaging identity — your encrypted inbox is now tied to your connected wallet instead of your device, so the same wallet sees the same conversations and group membership across phones and reinstalls. Faster sign-in — returning holders verify against a pre-built holder index instead of a live NFT lookup on every login. New arm64-v8a native stack (Reanimated 4, updated camera/face-tracking pipeline) carried forward from recent releases. Earlier: v2.37 bot-executed /buy /sell /swap with atomic on-chain fees, multi-device hot wallet support, encrypted nightly trading backups, DM groups, read receipts, marketplace history. v2.36 message deletion, Jupiter DCA + Limit V2 + Ultra V3, cNFT purchase receipts, Hermes intelligence. v2.35 cross-device account sync. v2.34 Banana Shop cosmetics. v2.33 Avatar Rooms with face tracking + Free-RASP security.
      saga_features: >-
        Optimized for Seeker — arm64-v8a only build with minSdk 24. Avatar Rooms and video calls use LiveKit WebRTC with full Bluetooth headset support, PiP mode, and Krisp AI noise filter. Mobile Wallet Adapter biometric prompt for tips, swaps, and Blink Actions (no app switching). Solana Actions server returns serialized transactions signed directly via MWA. Hot wallet vault keyed to your wallet address — switching between Seeker devices preserves your AutonoMonke positions.
