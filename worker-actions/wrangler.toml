name = "onlymonkes-actions"
main = "src/index.ts"
compatibility_date = "2026-03-23"
compatibility_flags = ["nodejs_compat"]

# 2026-10-22: onlymonkes.app is the public site (landing, /get, /open/*,
# legal, /monke/:mint) served by this worker; the web app moved to
# app.onlymonkes.app (scripts/web/wrangler.toml on the web-app branch).
routes = [
  { pattern = "onlymonkes.app", custom_domain = true },
  { pattern = "www.onlymonkes.app", custom_domain = true },
]

# Site images, robots.txt, sitemap.xml — served before the worker runs.
[assets]
directory = "site"

# Secrets (set via `wrangler secret put`):
#   HELIUS_API_KEY  — Helius RPC API key
#   JUP_API_KEY     — Jupiter Swap v2 API key (portal.jup.ag)
#   BOT_HTTP_URL    — bot Express base (VPS :3001) for /api/bot-command + /api/inbox-reset

# KV Namespaces
# FRAME_ALERTS (v2.38): doubles as the Helius webhook event queue (key prefix
# "helius:") plus the original Farcaster Frames alert store (key prefix
# "frame:"). Wired 2026-05-27 — the binding was previously commented out;
# any /frames/alert or /helius-events traffic before this deploy returned 500.
# 2026-07-30: also holds the public-stats cache under the single key
# "stats:latest" (no per-item prefix needed, just one snapshot object) —
# written by the scheduled() Cron Trigger below, read by GET /, /api/stats,
# and /monke/:mint.
[[kv_namespaces]]
binding = "FRAME_ALERTS"
id = "ca7310b8736a44f4bb2fe8576e482ce7"

# 2026-08-05: was documented in src/index.ts's own top comment as required
# ("create via `wrangler kv:namespace create TIP_ESCROW`") but the binding
# was never actually added here — every /escrow and /claim request (the
# entire tip-link feature) has been throwing on undefined env.TIP_ESCROW
# since this deploy went live. Stores encrypted ephemeral keypairs for tip
# links, 72h TTL.
[[kv_namespaces]]
binding = "TIP_ESCROW"
id = "bc8a253f9eb44a7f9e4841fa96014c66"

# Data Oracle Phase 1 (sentimentOracle.ts) — device registration, epoch aggregates, closed
# epoch scores. NOT YET CREATED — run `wrangler kv:namespace create SENTIMENT_ORACLE` and
# paste the returned id below before deploying, same as the TIP_ESCROW note above documents.
[[kv_namespaces]]
binding = "SENTIMENT_ORACLE"
id = "c9d1b341ee9445868909ebbb57000758"

# Device Integrity Attestation — backend-verified (Android Key Attestation +
# RASP + Saga/Genesis ownership) verdicts, cached per wallet. No on-chain
# write (see deviceIntegrity.ts doc comment for the cost rationale).
[[kv_namespaces]]
binding = "DEVICE_INTEGRITY"
id = "b0b8d8e361a749d28074f32134fe4fbf"

# 2026-08-26: MonkeGlobe/MonkeEvents public web repo (jumpstreet25/monke-globe)
# backend. Key = "locations:latest" (single aggregate JSON array, holder-
# opted-in-by-default per user decision 2026-08-26) and "event:<id>" /
# "rsvp:<eventId>:<wallet>" for the community events calendar. Locations and
# events are separate keys from onchainHolder.ts's own KV — this is
# community-contributed/self-reported data, not verified NFT ownership state.
[[kv_namespaces]]
binding = "COMMUNITY_DATA"
id = "272632d79eb043a69586f7cb4013c080"

# 2026-09-13: Service Binding to the MonkeLedger worker (separate project, same Cloudflare
# account — github.com/jumpstreet25/MonkeLedger). A plain fetch() to monkeledger's public
# workers.dev URL intermittently returns Cloudflare error 1042 ("Worker tried to fetch a
# workers.dev subdomain on the same account") — confirmed live: /api/verify's existing
# fetchOwnedMonkeFromMonkeLedger() happened to keep working, but the new treasury.ts NFT-card
# lookup hit 1042 on every attempt. A Service Binding is Cloudflare's own documented fix for
# same-account Worker-to-Worker calls — it routes directly between the two Workers' isolates
# instead of going out through the public network/DNS, so this restriction never applies.
# Call via env.MONKELEDGER.fetch(new Request(url)) rather than a plain fetch(url).
[ai]
binding = "AI"

[[services]]
binding = "MONKELEDGER"
service = "monkeledger"

# 2026-07-30: refreshes the public stats:latest KV cache every 4h so the
# "Check Your Monke" growth page (GET /, /monke/:mint) never makes a live
# Helius/CoinGecko call per page view. See scheduled() in src/index.ts.
# "0 * * * *" (added for Data Oracle Phase 1): hourly close of the previous
# sentiment epoch — see closeSentimentEpoch() in src/sentimentOracle.ts.
[triggers]
crons = ["0 */4 * * *", "0 * * * *"]

# 2026-10-21: OnlyMonkes web app. /api/rpc (webRpc.ts) proxies Solana RPC/DAS
# so no RPC key ships in the public site; /api/auth/* (webAuth.ts) signs XMTP
# access tokens for holders. Allowed browser origins (comma-separated, plus
# localhost while developing) — add the site's URL here when it deploys.
# XMTP_JWT_PRIVATE_KEY is a secret (`wrangler secret put`); its public half
# is in the XMTP backend's backend.toml [auth] keys on the VPS.
[vars]
WEB_APP_ORIGINS = "https://app.onlymonkes.app,https://onlymonkes.app,https://www.onlymonkes.app,https://onlymonkes-web.jumpstreet25.workers.dev"
XMTP_JWT_KID = "om-1"
# Bot profile import over HTTPS (Caddy route on the VPS → bot :3001/web-profile).
BOT_PROFILE_URL = "https://157-173-192-39.sslip.io/bot-api"

# Per-IP limit shared by /api/rpc and /api/auth/* (key prefixes differ).
[[ratelimits]]
name = "WEB_RPC_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
