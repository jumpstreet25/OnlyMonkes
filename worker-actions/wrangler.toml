name = "onlymonkes-actions"
main = "src/index.ts"
compatibility_date = "2026-03-23"
compatibility_flags = ["nodejs_compat"]

# Secrets (set via `wrangler secret put`):
#   HELIUS_API_KEY  — Helius RPC API key
#   JUP_API_KEY     — Jupiter Swap v2 API key (portal.jup.ag)

# KV Namespaces
# FRAME_ALERTS (v2.38): doubles as the Helius webhook event queue (key prefix
# "helius:") plus the original Farcaster Frames alert store (key prefix
# "frame:"). Wired 2026-05-27 — the binding was previously commented out;
# any /frames/alert or /helius-events traffic before this deploy returned 500.
# 2026-07-30: also holds the public-stats cache under the single key
# "stats:latest" (no per-item prefix needed, just one snapshot object) —
# written by the scheduled() Cron Trigger below, read by GET /, /api/stats,
# and /monke/:mint.
[[kv_namespaces]]
binding = "FRAME_ALERTS"
id = "ca7310b8736a44f4bb2fe8576e482ce7"

# 2026-08-05: was documented in src/index.ts's own top comment as required
# ("create via `wrangler kv:namespace create TIP_ESCROW`") but the binding
# was never actually added here — every /escrow and /claim request (the
# entire tip-link feature) has been throwing on undefined env.TIP_ESCROW
# since this deploy went live. Stores encrypted ephemeral keypairs for tip
# links, 72h TTL.
[[kv_namespaces]]
binding = "TIP_ESCROW"
id = "bc8a253f9eb44a7f9e4841fa96014c66"

# Data Oracle Phase 1 (sentimentOracle.ts) — device registration, epoch aggregates, closed
# epoch scores. NOT YET CREATED — run `wrangler kv:namespace create SENTIMENT_ORACLE` and
# paste the returned id below before deploying, same as the TIP_ESCROW note above documents.
[[kv_namespaces]]
binding = "SENTIMENT_ORACLE"
id = "c9d1b341ee9445868909ebbb57000758"

# 2026-07-30: refreshes the public stats:latest KV cache every 4h so the
# "Check Your Monke" growth page (GET /, /monke/:mint) never makes a live
# Helius/CoinGecko call per page view. See scheduled() in src/index.ts.
# "0 * * * *" (added for Data Oracle Phase 1): hourly close of the previous
# sentiment epoch — see closeSentimentEpoch() in src/sentimentOracle.ts.
[triggers]
crons = ["0 */4 * * *", "0 * * * *"]
