# LiveKit self-hosted config for OnlyMonkes
#
# Optimized for mobile video calls (3-15 participants)
# with embedded TURN for NAT traversal.

port: 7880
log_level: info

rtc:
  # UDP port range for media
  port_range_start: 50000
  port_range_end: 60000
  # Use public IP for ICE candidates (required on VPS)
  use_external_ip: true
  # TCP fallback for restrictive networks
  tcp_port: 7881
  # STUN servers for ICE gathering
  stun_servers:
    - stun:stun.l.google.com:19302
    - stun:stun1.l.google.com:19302

# Embedded TURN server (NAT/firewall traversal)
# Critical for mobile clients behind carrier-grade NAT
turn:
  enabled: true
  domain: your-domain.com        # Replace with your actual domain
  tls_port: 5349                 # TURN over TLS
  udp_port: 3478                 # TURN over UDP
  # For self-signed certs in dev, use:
  # cert_file: /etc/livekit/cert.pem
  # key_file: /etc/livekit/key.pem

# Room defaults
room:
  # Auto-create rooms when first participant joins
  auto_create: true
  # Maximum room duration: 2 hours
  max_duration: 7200s
  # Empty room timeout: clean up after 5 minutes
  empty_timeout: 300s

# API keys — set via environment variable or replace before deployment
# DO NOT commit real keys here
keys:
  YOUR_API_KEY: YOUR_API_SECRET

# Bandwidth management
# Simulcast is handled client-side; server forwards only needed layers
# Default limits per track (bytes/sec):
#   720p video: ~2.5 Mbps
#   360p video: ~800 Kbps
#   180p video: ~200 Kbps
#   Audio:      ~48 Kbps (Opus)
