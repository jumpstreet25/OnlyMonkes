global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monke Trader bot — runs on host at port 3001
  - job_name: "monke-trader"
    static_configs:
      - targets: ["host.docker.internal:3001"]
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
